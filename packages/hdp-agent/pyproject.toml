        [project]
        name = "hdp-agent"
        version = "0.1.0"
        description = "AI-agent-as-grantee interface + tool-use scaffolding."
        readme = "README.md"
        requires-python = ">=3.13"
        license = "MIT"
        authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
        dependencies = [
            "pydantic>=2.8",
        ]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=1.106.0"]

        [build-system]
        requires = ["hatchling"]
        build-backend = "hatchling.build"

        [tool.hatch.build.targets.wheel]
        packages = ["src/hdp_agent"]
