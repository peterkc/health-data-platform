[project]
name = "hdp-provenance"
version = "0.1.0"
description = "Source tracking + trust grading column pattern."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
dependencies = [
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdp_provenance"]
