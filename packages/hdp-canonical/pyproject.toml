    [project]
    name = "hdp-canonical"
    version = "0.1.0"
    description = "Canonical health record model + FHIR R4 bindings."
    readme = "README.md"
    requires-python = ">=3.13"
    license = "MIT"
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "pydantic>=2.8",
"fhir.resources>=7.1",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/hdp_canonical"]
