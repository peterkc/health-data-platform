[project]
name = "hdp-core"
version = "0.1.0"
description = "Merged data-layer primitives for canonical records, audit, identity, consent, provenance, and outbox."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
dependencies = [
    "pydantic>=2.8",
    "fhir.resources>=7.1",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdp_core"]
