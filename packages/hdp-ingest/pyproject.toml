[project]
name = "hdp-ingest"
version = "0.1.0"
description = "Source adapter registry + base classes."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdp_ingest"]
