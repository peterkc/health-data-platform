    [project]
    name = "hdp-api"
    version = "0.1.0"
    description = "FastAPI scaffolding + auth middleware stubs."
    readme = "README.md"
    requires-python = ">=3.13"
    license = "MIT"
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "fastapi>=0.115",
"uvicorn[standard]>=0.32",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/hdp_api"]
