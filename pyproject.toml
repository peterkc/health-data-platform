[project]
name = "health-data-platform"
version = "0.1.0"
description = "Python-first multi-vertical health data platform reference architecture"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]

# Root project has no runtime dependencies; all code lives in workspace members.
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "verticals/home-health/*",
    "apps/*",
]

[tool.uv.sources]
hdp-canonical = { workspace = true }
hdp-audit = { workspace = true }
hdp-identity = { workspace = true }
hdp-consent = { workspace = true }
hdp-provenance = { workspace = true }
hdp-ingest = { workspace = true }
hdp-api = { workspace = true }
hdp-agent = { workspace = true }
hdp-outbox = { workspace = true }
hh-oasis = { workspace = true }
hh-scribe = { workspace = true }
hh-hitl = { workspace = true }
hh-emr-sync = { workspace = true }
hh-mcp = { workspace = true }
hh-skills = { workspace = true }
home-health-scribe = { workspace = true }
hdp-observability = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# /Volumes/health-data is a volume root — exclude macOS metadata dirs and
# generated caches so ruff does not trip on EACCES from them.
extend-exclude = [
    ".Spotlight-V100",
    ".Trashes",
    ".fseventsd",
    ".tmp",
    ".venv",
    "vault",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, plus security (flake8-bandit)
# and async-correctness (flake8-async) — bandit-equivalent SAST without a separate tool.
select = ["E", "F", "I", "B", "UP", "W", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts (S101) and assert-False (B011).
"**/tests/**" = ["B011", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "packages",
    "verticals",
    "apps",
]
asyncio_mode = "auto"
# importlib mode avoids duplicate-basename collisions across workspace members.
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
# src-layout workspace: each packages/*/src and verticals/*/src is a package base,
# so hdp_api / hh_oasis / ... resolve as top-level modules without tests/ collisions.
explicit_package_bases = true
namespace_packages = true

[tool.coverage.run]
branch = true
source_pkgs = [
    "hdp_canonical", "hdp_audit", "hdp_identity", "hdp_consent",
    "hdp_provenance", "hdp_ingest", "hdp_api", "hdp_agent",
    "hdp_outbox", "hdp_observability",
    "hh_oasis", "hh_scribe", "hh_hitl", "hh_emr_sync", "hh_mcp", "hh_skills",
    "home_health_scribe",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
