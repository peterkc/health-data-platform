    [project]
    name = "hh-mcp"
    version = "0.1.0"
    description = "MCP server exposing home-health scribe + HITL + sync as tools."
    readme = "README.md"
    requires-python = ">=3.13"
    license = "MIT"
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "mcp>=1.2",
"hdp-api",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/hh_mcp"]
