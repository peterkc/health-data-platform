    [project]
    name = "hh-hitl"
    version = "0.1.0"
    description = "Human-in-the-loop checkpoint protocol + API."
    readme = "README.md"
    requires-python = ">=3.13"
    license = "MIT"
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "fastapi>=0.115",
"hdp-audit",
"hdp-canonical",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/hh_hitl"]
