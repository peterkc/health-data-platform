    [project]
    name = "hh-scribe"
    version = "0.1.0"
    description = "Transcript -> OASIS item extraction pipeline (LLM-backed)."
    readme = "README.md"
    requires-python = ">=3.13"
    license = { text = "MIT" }
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "anthropic>=0.39",
"hdp-canonical",
"hdp-agent",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/hh_scribe"]
