[project]
name = "hh-scribe"
version = "0.1.0"
description = "Transcript -> OASIS item extraction pipeline (LLM-backed)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
dependencies = [
    "anthropic>=0.39",
    "pydantic>=2.8",
    "mcp>=1.2",
    "hdp-core",
    "hdp-agent",
    "hdp-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_scribe"]
