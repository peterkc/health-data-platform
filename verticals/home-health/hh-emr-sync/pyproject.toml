[project]
name = "hh-emr-sync"
version = "0.1.0"
description = "Mock RPA -> fake EMR endpoint; outbox consumer."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
dependencies = [
    "hdp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_emr_sync"]
