    [project]
    name = "home-health-scribe"
    version = "0.1.0"
    description = "FastAPI service composing hh-* + hdp-* for a runnable demo."
    readme = "README.md"
    requires-python = ">=3.13"
    license = { text = "MIT" }
    authors = [{ name = "Peter K. Chan", email = "peterkc@hey.com" }]
    dependencies = [
        "fastapi>=0.115",
"uvicorn[standard]>=0.32",
"hh-scribe",
"hh-oasis",
"hh-hitl",
"hh-emr-sync",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/home_health_scribe"]
