extends:
  - "@commitlint/config-conventional"

rules:
  scope-enum:
    - 2
    - always
    - [
        workspace,
        packages,
        verticals,
        apps,
        docs,
        ci,
        deps,
        infra,
        vault,
        adr,
        spec,
        research,
        hdp-core,
        hdp-api,
        hdp-agent,
        hdp-observability,
        hdp-hitl,
        hh-scribe,
        hh-emr-sync,
        home-health-scribe,
      ]

# Keep the scope-pattern map authored so tooling can discover which
# paths map to which commit scopes.
x-scope-patterns:
  workspace: "pyproject.toml"
  ci: ".github/**"
  docs:
    - "README.md"
    - "CLAUDE.md"
  deps:
    - "**/pyproject.toml"
    - "uv.lock"
  infra:
    - "docker-compose*.yml"
  hdp-core: "packages/hdp-core/**"
  hdp-api: "packages/hdp-api/**"
  hdp-agent: "packages/hdp-agent/**"
  hdp-observability: "packages/hdp-observability/**"
  hdp-hitl: "packages/hdp-hitl/**"
  hh-scribe: "verticals/home-health/hh-scribe/**"
  hh-emr-sync: "verticals/home-health/hh-emr-sync/**"
  home-health-scribe: "apps/home-health-scribe/**"
