output:
  - failure

pre-commit:
  parallel: true
  commands:
    beads:
      run: bd hooks run pre-commit

    ruff-check:
      run: uv run ruff check --fix {staged_files}
      glob: "*.py"
      stage_fixed: true
      skip:
        - merge
        - rebase

    ruff-format:
      run: uv run ruff format {staged_files}
      glob: "*.py"
      stage_fixed: true
      skip:
        - merge
        - rebase

    pytest-collect:
      # Structural sanity: collection must succeed across the workspace.
      # Fast (<1s) and catches import errors / syntax issues before commit.
      run: uv run pytest -q --co
      glob: "*.py"
      skip:
        - merge
        - rebase

post-merge:
  commands:
    beads:
      run: bd hooks run post-merge

post-checkout:
  commands:
    beads:
      run: bd hooks run post-checkout

prepare-commit-msg:
  commands:
    beads:
      run: bd hooks run prepare-commit-msg {1} {2} {3}

pre-push:
  commands:
    beads:
      run: bd hooks run pre-push

    tests:
      run: uv run pytest -q
