language: en-US
inheritance: true

tone_instructions: "Focus on correctness and logic errors. Skip style issues that ruff handles. Be direct."

reviews:
  profile: "assertive"

  request_changes_workflow: true
  fail_commit_status: true
  review_details: true

  suggested_labels: false
  auto_apply_labels: true

  # Exclude-style filtering (agx pattern): everything is reviewable except
  # the paths below. The earlier include-style allowlist made infra files
  # (docker-compose, pyproject, workflows) invisible to CR — observed on
  # PR #15 ("All files are ignored"). Markdown stays reviewable on purpose:
  # README/SECURITY are public-facing product for this repo.
  path_filters:
    - "!vault/**"               # Orphan-branch worktree (design prose)
    - "!.beads/**"              # Issue tracking database
    - "!.cache/**"              # Ephemeral caches
    - "!.tmp/**"                # Temp scratch files
    - "!**/.venv/**"
    - "!**/__pycache__/**"
    - "!**/uv.lock"
    - "!**/test_smoke.py"       # assert-True placeholders

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Focus on correctness, security, and logic errors. Skip trivial style
        suggestions that ruff/formatter already handles (naming conventions,
        import style, str vs StrEnum, unused variables). Do not suggest
        alternative patterns unless the current pattern has a concrete bug
        or performance issue. Skip column width and formatting nitpicks
        unless they cause data loss or misrepresentation.
    - path: "**/test_*.py"
      instructions: |
        Focus on test correctness and coverage gaps. Do not nitpick test
        structure, assertion style, or mock patterns unless they cause
        false positives/negatives.
    - path: "justfile"
      instructions: |
        Check recipe dependencies and cross-recipe consistency. Verify that
        recipes referenced in composite recipes (e.g., 'verify') have their
        tool dependencies documented or bootstrapped.
    - path: ".github/workflows/**"
      instructions: |
        Flag unpinned actions (use SHA + comment with version tag). Check that
        permissions are minimal. Verify concurrency groups match workflow scope.
    - path: "**"
      instructions: |
        `vault/` and `.beads/` are orphan-branch worktrees. Their content
        lives on the `vault` and `beads` branches and is mounted into the
        working tree at `<repo-root>/vault/` and `<repo-root>/.beads/`, but
        is ABSENT from the feature-branch checkout this review runs against.
        Do NOT flag references to `vault/...` or `.beads/...` paths (code
        spans, comments, or directive strings) as broken, missing, or
        non-existent — they are valid cross-branch citations that resolve in
        the mounted working tree. Tracked markdown links vault content via
        absolute GitHub URLs on the `vault` branch (e.g.
        `https://github.com/peterkc/health-data-platform/tree/vault/...`);
        bare `vault/...` strings are intentional path references, not links.

  auto_review:
    enabled: false
    labels:
      - "coderabbit"
    drafts: true                # Review draft PRs when labeled (draft-first workflow)
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  finishing_touches:
    simplify:
      enabled: true

  tools:
    ruff:
      enabled: true
    # Give CR up to 15 min to wait on CI so it reviews final check states,
    # not in-flight ones (replaces the non-schema `reviews.timeout` key).
    github-checks:
      enabled: true
      timeout_ms: 900000
    languagetool:
      enabled: true
      enabled_only: false
      level: "default"

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Must follow conventional commit format: type(scope): description"
    description:
      mode: "warning"

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: "local"
  mcp:
    usage: disabled

chat:
  auto_reply: true
  allow_non_org_members: true   # Public repo — external contributors welcome
