    claim: CMS-0062-P proposes broader HIPAA FHIR transactions, drug workflows, endpoint publication, and reporting, but none is final law as of the capture date.
    class: observed
    outcome: accepted
    raw_paths: [raw/02-cms-0062-p.md]
    notes: Finalization and dates remain non-blocking unknowns.
  - id: F-004
    source_ids: [S-003]
    claim: HTI-4 creates modular provider prior-authorization certification criteria connected to EHR workflows; certification and provider incentive reporting are distinct obligations.
    class: observed
    outcome: accepted
    raw_paths: [raw/03-hti-4-ehr.md]
    notes: The evidence does not require every third-party component to be certified.
  - id: F-005
    source_ids: [S-004]
    claim: CRD, DTR, PAS, and CDex standardize discovery, documentation capture, submission lifecycle, and supplemental data exchange, not payer policy, evidence sufficiency, local orchestration, or outcome learning.
    class: observed
    outcome: accepted
    raw_paths: [raw/04-davinci-guides.md]
    notes: This defines the open product boundary above and beside FHIR transport.
  - id: F-006
    source_ids: [S-005]
    claim: WEDI respondents report barriers in policy digitization, delegated integration, provider expertise, cross-party testing, workflow redesign, training, and funding.
    class: observed
    outcome: accepted
    raw_paths: [raw/05-wedi-readiness.md]
    notes: The 86-response sample is directional and provider representation is small.
  - id: F-007
    source_ids: [S-006]
    claim: Current HDP authority positions the project as a workflow/governance layer paired with a CDR, but the relevant packages are stubs rather than implemented primitives.
    class: observed
    outcome: accepted
    raw_paths: [raw/06-hdp-revisions.md]
    notes: Strategy must not describe designed packages as production behavior.
  - id: F-008
    source_ids: [S-006]
    claim: Older vault guidance to build and own a FHIR server conflicts with current main guidance to pair with an existing CDR.
    class: observed
    outcome: accepted
    raw_paths: [raw/06-hdp-revisions.md]
    notes: Current main is newer product authority; explicit supersession remains a decision.
  - id: F-009
    source_ids: [S-006]
    claim: HDP's provenance, audit, identity, consent, document, adapter, outbox, and human-review concepts map naturally to authorization and denial workflows, but current reuse estimates are design claims.
    class: interpreted
    outcome: accepted
    raw_paths: [raw/06-hdp-revisions.md]
    notes: One deep vertical must prove the reuse thesis.
  - id: F-010
    source_ids: [S-007]
    claim: Semantica implements relevant temporal, graph, decision, policy, and provenance concepts but has broad dependencies, volatile defaults, and source-visible maturity contradictions.
    class: observed
    outcome: accepted
    raw_paths: [raw/07-semantica.md]
    notes: Evidence supports reference or optional-sidecar use, not authoritative core adoption.
  - id: F-011
    source_ids: [S-008]
    claim: TencentDB Agent Memory is conversation-oriented, fail-soft agent memory without the verified identity, authorization, retention, and assured-persistence controls needed for authoritative PHI case state.
    class: observed
    outcome: accepted
    raw_paths: [raw/08-tencentdb-agent-memory.md]
    notes: It may support synthetic developer memory only.
  - id: F-012
    source_ids: [S-009]
    claim: Gortex is development tooling, Pulumi is deployment control-plane infrastructure, and Pydantic AI is an optional application agent framework whose host must retain side-effect authority.
    class: interpreted
    outcome: accepted
    raw_paths: [raw/09-control-plane-tools.md]
    notes: None should define the domain core of the first OSS primitive.
  - id: F-013
    source_ids: [S-010]
    claim: Backbone publicly spans pre-service and pre-bill chart review against payer policy, medical necessity, coding, denial risk, and outcome feedback inside existing operational workflows.
    class: observed
    outcome: accepted
    raw_paths: [raw/10-backbone-public.md]
    notes: Guarantee and implementation claims remain unverified company assertions.
  - id: F-014
    source_ids: [S-001, S-003, S-004, S-005]
    claim: The durable opportunity is a mixed-channel provider evidence and workflow layer that complements EHR and payer APIs rather than replacing their standards or certification roles.
    class: interpreted
    outcome: accepted
    raw_paths: [raw/01-cms-0057-f.md, raw/03-hti-4-ehr.md, raw/04-davinci-guides.md, raw/05-wedi-readiness.md]
    notes: This interpretation underpins the proposed OSS boundary.

decisions:
  - id: D-001
    question: How should HDP respond to the CMS prior-authorization changes?
    status: accepted
    decision: Reposition one HDP vertical around a deep OSS authorization evidence ledger; do not broadly pivot into an EHR, FHIR server, clearinghouse, or full RCM platform.
    finding_ids: [F-001, F-004, F-005, F-007, F-009, F-014]
    accepted_by: peterkc
    accepted_at: 2026-08-05T15:01:05Z
    rationale: The evidence and provenance layer remains valuable across FHIR and legacy channels and directly exercises HDP's intended primitives.
    rejected_alternatives:
      - alternative: Build a complete FHIR prior-authorization server.
        reason: It duplicates standards infrastructure, conflicts with current HDP authority, and is too broad for depth-first OSS work.
      - alternative: Keep HDP focused only on the home-health scribe.
        reason: It would not test the newly important payer/provider evidence workflow identified by the approved scope.
  - id: D-002
    question: What should the first OSS primitive own?
    status: accepted
    decision: Own append-only authorization case events, content-addressed evidence, bitemporal payer-policy snapshots, requirement-to-evidence links, human attestations, denial/request-more-information lineage, and deterministic packet validation/export.
    finding_ids: [F-002, F-005, F-006, F-009, F-014]
    accepted_by: peterkc
    accepted_at: 2026-08-05T15:01:05Z
    rationale: These functions remain outside the implementation guides and are useful to providers, vendors, and mixed-channel workflows.
    rejected_alternatives:
      - alternative: Start with autonomous medical-necessity adjudication.
        reason: It is higher risk, harder to validate, and not required to prove the evidence primitive.
      - alternative: Start with browser automation.
        reason: Browser transport is channel-specific and already has a separate research lane; the evidence ledger survives the FHIR transition.
  - id: D-003
    question: How should HDP integrate with the standards ecosystem?
    status: accepted
    decision: Pair with EHR, CEHRT, CDR, FHIR gateway, clearinghouse, and portal adapters through explicit interfaces; import and export CRD/DTR/PAS/CDex artifacts without claiming certification or owning payer adjudication.
    finding_ids: [F-001, F-003, F-004, F-005, F-008]
    accepted_by: peterkc
    accepted_at: 2026-08-05T15:01:05Z
    rationale: This preserves standards conformance and makes the primitive useful in both API and legacy workflows.
    rejected_alternatives:
      - alternative: Make FHIR the internal storage model.
        reason: Current HDP authority treats FHIR as an edge projection and the evidence ledger needs cross-channel events not defined as one FHIR resource.
  - id: D-004
    question: Which named tools belong in the first implementation?
    status: accepted
    decision: Keep Semantica as a reference or later optional sidecar, reject TencentDB Agent Memory from PHI runtime, use Gortex only for development, defer Pulumi until deployment, and keep Pydantic AI optional until deterministic behavior and human gates are complete.
    finding_ids: [F-010, F-011, F-012]
    accepted_by: peterkc
    accepted_at: 2026-08-05T15:01:05Z
    rationale: The first OSS contribution should expose HDP's own domain depth rather than hide it behind immature or non-domain infrastructure.
    rejected_alternatives:
      - alternative: Adopt all named tools as core components.
        reason: They serve different layers and several lack the authority or assurance needed for case state.

questions:
  - id: Q-001
    status: open
    blocking: false
    question: What exact CEHRT configuration will satisfy the 2027 Electronic Prior Authorization measure in a deployment using an external OSS evidence component?
    unlocks: Eligibility claims and certified-partner integration guidance.
  - id: Q-002
    status: open
    blocking: false
    question: Which CMS-0062-P provisions and dates will survive into a final rule?
    unlocks: Drug, clearinghouse, endpoint-directory, and universal-HIPAA roadmap commitments.
  - id: Q-003
    status: open
    blocking: false
    question: Which provider, payer, clearinghouse, or vendor design partner will validate the first evidence-ledger workflow and synthetic fixtures?
    unlocks: Product validation and a justified second adapter.
  - id: Q-004
    status: open
    blocking: false
    question: Which permissively licensed synthetic payer policies and authorization examples can support a public conformance corpus?
    unlocks: A richer OSS fixture set without copying proprietary payer criteria.

exclusions:
  - id: X-001
    exclusion: Legal or regulatory compliance advice
    rationale: The artifact is product and architecture research, not counsel.
  - id: X-002
    exclusion: Non-public user context in the public hub
    rationale: The hub admits public evidence only.
  - id: X-003
    exclusion: Uncommitted payer-portal research as evidence
    rationale: Dirty bytes cannot support accepted findings under the research contract.

