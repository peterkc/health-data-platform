scope:
  problem: >-
    Decide whether HDP should deepen around one independently useful,
    provider-side prior-authorization OSS primitive under CMS-0057-F, HTI-4,
    and CMS-0062-P, rather than attempting a broad platform pivot.
  audience: >-
    The HDP owner and prospective OSS users or maintainers evaluating technical
    depth and practical utility in provider-side prior authorization.
  boundaries: >-
    In scope are final versus proposed CMS obligations; EHR and CEHRT integration;
    Da Vinci CRD, DTR, PAS, and CDex; denial, appeal, billing, and reporting gaps;
    a change-by-change map of payer duties, provider workflow effects, shared
    implementation gaps, and HDP support boundaries; HDP primitive reuse;
    named-tool fit; and defensible provider-side opportunities.
    Out of scope are legal advice, a full market-size model, implementation work,
    a complete EHR, clearinghouse, FHIR server, or revenue-cycle platform,
    unsupported company claims, and broad pharmacy-benefit analysis except where
    CMS-0062-P changes the opportunity. CV value is an implicit benefit, not the
    design target.
  risks: >-
    Stale or proposed policy may be treated as final; FHIR transport may be
    confused with workflow and evidence value; standalone software may be assumed
    to qualify as CEHRT; HDP may be overfit to one company; or non-public user
    context may leak into the public vault.
  success: >-
    Evidence supports one narrow OSS primitive with a production-shaped boundary,
    exact interoperability role, implementation-depth requirements, deliberate
    exclusions, a payer/provider impact and opportunity map, prioritized
    implementation problems, an adopt/reference/reject verdict for every named
    tool, and explicit unresolved questions.

