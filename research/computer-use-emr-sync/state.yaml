# Phase 1 SCOPE — pre-filled from GH #18 + #14 (user-approved at dispatch)
scope:
  problem: >
    What a browser-level (DOM-first, vision-assist) EMR sync transport needs
    to be credible infrastructure: securing credentialed sessions, grounding
    sandbox selection, and capturing how long-running browser workflows
    against EMR UIs fail.
  audience: >
    Driver-repository implementers and the hh-emr-sync adapter-contract
    design (#11 seam). Public vault — written for external readers.
  boundaries: >
    Hub + security posture + sandbox decision + taxonomy seed. Driver
    implementation is out of scope for this repo (own repository, distinct
    security/testing posture). Synthetic data only; no PHI anywhere.
  risks: >
    Vault is public: no leak-sensitive context. Credentialed browser
    automation carries prompt-injection and credential-exposure risks —
    addressed structurally in the posture section.
  success: >
    GH #18 exit conditions: hub exists with posture + sandbox decision
    recorded; taxonomy carries >=1 hardening recommendation per observed
    failure class; adapter-contract implications fed back to #11.

