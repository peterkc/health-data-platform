# STUB — copy to migrations/alembic.ini and refine during Phase 2 (mvs-ddl).
# Part of vault/specs/hdp-schema-seed/ (see design.md §Component Design).

[alembic]
script_location = migrations
# DB URL is overridden in env.py from DATABASE_URL when set.
sqlalchemy.url = postgresql://hdp:hdp@localhost:5437/hdp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
